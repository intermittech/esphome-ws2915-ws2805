# QuinLED dig2analog-ultra-5ch in Ultra mode: four boards, one RGB light each (e.g. four garden posts), and
# one virtual strip over them, so ESPHome's addressable effects (rainbow, color wipe, scan, twinkle, ...) run
# across the posts. Each post is one pixel; its board applies gamma and glides between the effect's steps.
# ESP32 classic, ESP-IDF. Boards in Ultra mode: protocol 3 (or auto: they recognise Ultra frames).

substitutions:
  name: d2a-ultra-strip
  friendly_name: QuinLED dig2analog Ultra strip
  data_pin: GPIO16   # controller output wired to the first board's Data-In

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/esphome-ws2915-ws2805@main
    components: [dig2analog_ultra, dig2analog_ultra_strip]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

dig2analog_ultra:
  id: ultra
  pin: ${data_pin}
  num_boards: 4

light:
  # The posts: one RGB light per board. They stay separate lights too; a post that is on by itself shows its
  # own state, the strip drives the posts that are off. Leave out internal: true to see them in Home Assistant.
  - platform: dig2analog_ultra
    id: post_1
    name: Post 1
    internal: true
    board: 0
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_ultra
    id: post_2
    name: Post 2
    internal: true
    board: 1
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_ultra
    id: post_3
    name: Post 3
    internal: true
    board: 2
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_ultra
    id: post_4
    name: Post 4
    internal: true
    board: 3
    red: 1
    green: 2
    blue: 3

  # The strip: pixel 0 = post_1, pixel 1 = post_2, ... (any order, any boards and data lines)
  - platform: dig2analog_ultra_strip
    name: Garden posts
    lights: [post_1, post_2, post_3, post_4]
    effects:
      - addressable_rainbow:
          name: Rainbow
          width: 4          # one full rainbow over the four posts
      - addressable_color_wipe:
      - addressable_scan:
          move_interval: 300ms
      - addressable_twinkle:
      - addressable_fireworks:
      - addressable_flicker:
