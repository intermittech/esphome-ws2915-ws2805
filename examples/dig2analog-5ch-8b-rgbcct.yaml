# dig2analog-5ch-8b (WS2805, 8-bit) as one RGBCCT light.
#   CH1 R, CH2 G, CH3 B, CH4 (W1) warm white, CH5 (W2) cold white (WLED order: RGB + WW + CW)
# Same as the 16b example; the WS2805 has no gain header.

substitutions:
  name: d2a-5ch-8b
  friendly_name: dig2analog 5ch 8b
  data_pin: GPIO16
  boards: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/esphome-ws2915-ws2805@main
    components: [ws2915]
    # Developing the component itself? Use the local copy instead:
    # source:
    #   type: local
    #   path: ../components

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

ws2915:
  id: d2a
  chip_type: ws2805
  pin: ${data_pin}
  num_chips: ${boards}
  refresh_interval: 1s
  transition_refresh_rate: 200Hz
  power_limit:
    channel_current:
      red: 3A
      green: 3A
      blue: 3A
      white1: 5A
      white2: 5A
    max_chip_current: 5A

output:
  - platform: ws2915
    id: out_red
    channel: red
  - platform: ws2915
    id: out_green
    channel: green
  - platform: ws2915
    id: out_blue
    channel: blue
  - platform: ws2915
    id: out_warm
    channel: white1
  - platform: ws2915
    id: out_cold
    channel: white2

light:
  - platform: rgbww
    id: rgbcct
    name: RGBCCT
    red: out_red
    green: out_green
    blue: out_blue
    cold_white: out_cold
    warm_white: out_warm
    cold_white_color_temperature: 153 mireds  # 6500 K
    warm_white_color_temperature: 370 mireds  # 2700 K
    color_interlock: true
    gamma_correct: 2.8
    default_transition_length: 1s
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
      - strobe:
      - flicker:

sensor:
  - platform: template
    name: LED current (estimated)
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: return id(d2a).get_current();
