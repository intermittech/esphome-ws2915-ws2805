# QuinLED dig2analog-ultra-5ch in Ultra mode: five single-channel white downlights on one board (CH1-CH5), each its
# own light in Home Assistant, plus a hidden strip over all five for a chase as a notification.
#   - Everyday use: the five downlights, as usual.
#   - Notification: the "notify_chase" action (from Home Assistant, or the test button) runs a chase over the five,
#     then the downlights go back to exactly what they were. The strip is a layer on top while it runs: the lights'
#     own state stays underneath (changes made meanwhile are kept), so there is nothing to save or restore.
# ESP32 classic, ESP-IDF.

substitutions:
  name: d2a-ultra-downlights
  friendly_name: QuinLED dig2analog Ultra downlights

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/esphome-ws2915-ws2805@main
    components: [dig2analog_ultra, dig2analog_ultra_strip]

logger:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

api:
  actions:
    # Home Assistant: action "esphome.d2a_ultra_downlights_notify_chase", runs: 3
    - action: notify_chase
      variables:
        runs: int
      then:
        - script.execute:
            id: notify_chase
            runs: !lambda "return runs;"

dig2analog_ultra:
  id: ultra
  pin: GPIO16
  num_boards: 1

light:
  - platform: dig2analog_ultra
    id: down_1
    name: Downlight 1
    board: 0
    channel: 1
  - platform: dig2analog_ultra
    id: down_2
    name: Downlight 2
    board: 0
    channel: 2
  - platform: dig2analog_ultra
    id: down_3
    name: Downlight 3
    board: 0
    channel: 3
  - platform: dig2analog_ultra
    id: down_4
    name: Downlight 4
    board: 0
    channel: 4
  - platform: dig2analog_ultra
    id: down_5
    name: Downlight 5
    board: 0
    channel: 5

  # The five as pixels. Single-channel lights show a pixel's brightness (its brightest colour channel), so any
  # colour the chase uses comes out as white at that level.
  - platform: dig2analog_ultra_strip
    id: notify_strip
    name: Downlight notification
    internal: true
    lights: [down_1, down_2, down_3, down_4, down_5]
    default_transition_length: 400ms   # the fade back to the downlights' own state
    # effect_glide auto (default): the light the chase arrives at is on at once, the one it leaves fades out
    # over 50 ms. effect_glide: false gives hard steps.
    effects:
      - addressable_lambda:
          name: Chase
          update_interval: 150ms       # one light per 150 ms, 0.75 s per run over five lights
          lambda: |-
            static int pos = 0;
            if (initial_run)
              pos = 0;
            it.all() = Color::BLACK;
            it[pos % it.size()] = Color::WHITE;
            pos++;
      - addressable_scan:
          name: Scan
          move_interval: 150ms         # back and forth: 1.2 s per round trip over five lights

script:
  - id: notify_chase
    mode: restart                      # a new notification starts over
    parameters:
      runs: int
    then:
      - light.turn_on:
          id: notify_strip
          brightness: 100%
          effect: Chase
      - delay: !lambda "return runs * 750;"   # runs x 5 lights x 150 ms
      - light.turn_off: notify_strip    # the downlights fade back to their own state

button:
  - platform: template
    name: Test notification
    on_press:
      - script.execute:
          id: notify_chase
          runs: 3
