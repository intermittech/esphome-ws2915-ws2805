# QuinLED dig2analog-ultra-5ch in Ultra mode, advanced: two data lines with mixed lights, a virtual strip per line,
# and ESPHome's partition joining both into one "Facade" strip for effects across the whole front.
#   Front line (GPIO16): 3 boards, one RGBW uplight each
#   Side line (GPIO17):  board 0 = an RGB light + two single-channel path spots, board 1 = an RGBCCT light
# Pixels map to each light type: RGB / RGBW take the colour, RGBCCT puts white on its own colour temperature,
# single-channel lights take the pixel's brightness.
# A single dig2analog_ultra_strip can also list lights from both lines directly; the partition is for when you
# want the lines as separate strips too, or need a reversed piece.
# ESP32 classic, ESP-IDF.

substitutions:
  name: d2a-ultra-facade
  friendly_name: QuinLED dig2analog Ultra facade

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://intermittech/esphome-ws2915-ws2805@main
    components: [dig2analog_ultra, dig2analog_ultra_strip]

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

dig2analog_ultra:
  - id: front_line
    pin: GPIO16
    num_boards: 3
  - id: side_line
    pin: GPIO17
    num_boards: 2

light:
  # front line: one RGBW uplight per board
  - platform: dig2analog_ultra
    dig2analog_ultra_id: front_line
    id: front_1
    name: Front 1
    internal: true
    board: 0
    red: 1
    green: 2
    blue: 3
    white: 4
  - platform: dig2analog_ultra
    dig2analog_ultra_id: front_line
    id: front_2
    name: Front 2
    internal: true
    board: 1
    red: 1
    green: 2
    blue: 3
    white: 4
  - platform: dig2analog_ultra
    dig2analog_ultra_id: front_line
    id: front_3
    name: Front 3
    internal: true
    board: 2
    red: 1
    green: 2
    blue: 3
    white: 4

  # side line, board 0: an RGB light and two path spots; board 1: an RGBCCT light
  - platform: dig2analog_ultra
    dig2analog_ultra_id: side_line
    id: side_rgb
    name: Side RGB
    internal: true
    board: 0
    red: 1
    green: 2
    blue: 3
  - platform: dig2analog_ultra
    dig2analog_ultra_id: side_line
    id: spot_a
    name: Path spot A
    board: 0
    channel: 4
  - platform: dig2analog_ultra
    dig2analog_ultra_id: side_line
    id: spot_b
    name: Path spot B
    board: 0
    channel: 5
  - platform: dig2analog_ultra
    dig2analog_ultra_id: side_line
    id: side_rgbcct
    name: Side RGBCCT
    internal: true
    board: 1
    red: 1
    green: 2
    blue: 3
    warm_white: 4
    cold_white: 5
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K

  # one strip per line
  - platform: dig2analog_ultra_strip
    id: front_strip
    name: Front
    lights: [front_1, front_2, front_3]
    effects:
      - addressable_rainbow:
          width: 3
  - platform: dig2analog_ultra_strip
    id: side_strip
    name: Side
    lights: [side_rgb, spot_a, spot_b, side_rgbcct]
    effects:
      - addressable_scan:
          move_interval: 250ms

  # both lines as one strip: front left to right, then the side line back towards the front
  - platform: partition
    name: Facade
    gamma_correct: 1.0          # required: the boards apply each light's own gamma
    segments:
      - id: front_strip
        from: 0
        to: 2
      - id: side_strip
        from: 0
        to: 3
        reversed: true
    effects:
      - addressable_rainbow:
          width: 7
      - addressable_color_wipe:
      - addressable_scan:
          move_interval: 200ms
      - addressable_twinkle:
    # The strips glide between the partition's steps. For hard steps (strobe) on a partition, set
    # effect_glide: false on the strips; on a strip itself, effect_glide: auto already leaves strobe hard.
